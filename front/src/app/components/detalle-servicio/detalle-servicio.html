<div class="detalle-servicio" *ngIf="service">
  <div class="detalle-encabezado">
    <div>
      <span class="detalle-etiqueta">Información del servicio</span>
      <h3>{{ service.nameS }}</h3>
    </div>

    <div class="detalle-precio">
      {{ service.priceS | currency:'ARS':'symbol':'1.2-2':'es-AR' }}
    </div>
  </div>

  <div class="detalle-contenido">
    <div class="detalle-seccion">
      <h4>Descripción</h4>
      <p>{{ service.descriptionS }}</p>
    </div>

    <div class="detalle-informacion">
      <div>
        <span class="detalle-label">Categoría</span>
        <p>{{ service.category?.nameC }}</p>
      </div>

      <div>
        <span class="detalle-label">Profesional</span>
        <p>
          {{ service.professional?.nameP }}
          {{ service.professional?.surnameP }}
        </p>
      </div>
    </div>
  </div>

  <div class="detalle-acciones">
    <button
      type="button"
      class="btn btn-outline-secondary"
      (click)="cerrarDetalle()"
    >
      Cerrar detalle
    </button>
  </div>
</div>
